name = "xy-latlng-to-map-reinfolib-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# 不動産情報ライブラリAPIキー（REINFOLIB_API_KEY）は絶対にここへ書かない。
# 本番: `wrangler secret put REINFOLIB_API_KEY`
# ローカル開発: `proxy/.dev.vars` に `REINFOLIB_API_KEY=...` を記載（.gitignore 済み）

[vars]
# カンマ区切りで、このプロキシへのアクセスを許可するオリジンを列挙する
ALLOWED_ORIGINS = "https://xy-latlng-to-map.com"

[env.development]
[env.development.vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://xy-latlng-to-map.com"
