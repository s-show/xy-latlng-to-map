# proxy/ はリポジトリ直下の pnpm-workspace.yaml とは別の、独立したpnpmワークスペースとして扱う。
# これが無いと pnpm はここを親（リポジトリ直下）のワークスペースの一部と誤認し、
# proxy/package.json の依存関係（wrangler等）が一切インストールされなくなる。
packages: []
allowBuilds:
  # wrangler が実行時に必要とするネイティブバイナリ（バンドラ本体・Workers実行エンジン）。
  # 公式パッケージであり、ビルドスクリプトの実行を許可しないと wrangler dev/deploy が動作しない。
  esbuild: true
  workerd: true
